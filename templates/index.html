<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TreeSize Moderne</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main class="container">
    <header class="hero">
      <div>
        <h1>TreeSize Moderne</h1>
        <p>Analysez vos lecteurs, comparez leur occupation et visualisez les répertoires racine en un coup d'œil.</p>
      </div>
      <button id="refresh-disks" class="btn secondary">Actualiser les lecteurs</button>
    </header>

    <section class="card">
      <h2>1) Sélection des lecteurs</h2>
      <div id="disk-list" class="disk-grid"></div>
      <div class="actions">
        <button id="select-all" class="btn ghost">Tout sélectionner</button>
        <button id="unselect-all" class="btn ghost">Tout désélectionner</button>
        <button id="scan" class="btn primary">Analyser</button>
      </div>
      <p id="status" class="status">Chargement des lecteurs…</p>
    </section>

    <section class="card">
      <h2>2) Graphique</h2>
      <div id="chart" class="chart"></div>
    </section>

    <section class="card">
      <h2>3) Tableau des dossiers racine</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Lecteur</th>
              <th>Répertoire</th>
              <th>Chemin</th>
              <th class="right">Taille</th>
            </tr>
          </thead>
          <tbody id="results-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <template id="bar-template">
    <div class="bar-row">
      <div class="bar-label"></div>
      <div class="bar-track"><div class="bar-fill"></div></div>
      <div class="bar-value"></div>
    </div>
  </template>

  <script src="/static/app.js"></script>
</body>
</html>
